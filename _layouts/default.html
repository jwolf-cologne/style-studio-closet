<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}Style Studio Closet</title>
    <meta name="description" content="Privacy, support, and terms for Style Studio Closet.">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <div class="hero__mark">Style Studio Closet</div>
        <div class="hero__art" aria-hidden="true">
          <span class="tile tile--one">Closet</span>
          <span class="tile tile--two">Looks</span>
          <span class="tile tile--three">AI</span>
        </div>
        <h1>{{ page.hero_title | default: page.title | default: site.title }}</h1>
        <p>{{ page.hero_subtitle | default: "A digital wardrobe, outfit planner, and AI styling companion for iPhone and iPad." }}</p>
      </section>

      <section class="content-card">
        {{ content }}
      </section>

      <nav class="footer-nav" aria-label="Footer">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/privacy' | relative_url }}">Privacy</a>
        <a href="{{ '/support' | relative_url }}">Support</a>
        <a href="{{ '/terms' | relative_url }}">Terms</a>
      </nav>
    </main>
  </body>
</html>
